# XcodeGen (https://github.com/yonaskolb/XcodeGen) — alternativa ao
# scripts/gen_xcodeproj.py. Uso: `xcodegen generate`.
name: Portico
options:
  bundleIdPrefix: io.portico
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    GCC_C_LANGUAGE_STANDARD: gnu11
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Portico:
    type: application
    platform: iOS
    sources:
      - Sources/PorticoApp
      - Sources/PorticoCore
      - Sources/PorticoRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.portico.Portico
        INFOPLIST_FILE: Sources/PorticoApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/PorticoRuntime/include"
        OTHER_CFLAGS:
          - "-DPR_ENABLE_ZLIB=1"
        MARKETING_VERSION: "0.1.0"
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: libz.tbd
