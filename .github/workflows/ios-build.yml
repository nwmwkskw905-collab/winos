name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build WinOS (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --version
          swift --version
          clang --version

      - name: Validate project structure (PBXNativeTarget / Scheme / Config)
        run: |
          echo "=== PBXNativeTarget ==="
          grep -c "isa = PBXNativeTarget" Portico.xcodeproj/project.pbxproj
          grep "isa = PBXNativeTarget" -A 2 Portico.xcodeproj/project.pbxproj
          echo ""
          echo "=== Targets list from pbxproj ==="
          grep "PBXNativeTarget" Portico.xcodeproj/project.pbxproj | grep -o "name = [^;]*" || true
          echo ""
          echo "=== Checking for PorticoRuntime / PorticoCore targets (should NOT exist) ==="
          if grep -q "name = PorticoRuntime" Portico.xcodeproj/project.pbxproj; then echo "FOUND PorticoRuntime (unexpected)"; else echo "OK: PorticoRuntime target NOT found"; fi
          if grep -q "name = PorticoCore" Portico.xcodeproj/project.pbxproj; then echo "FOUND PorticoCore (unexpected)"; else echo "OK: PorticoCore target NOT found"; fi
          echo ""
          echo "=== Schemes ==="
          ls -la Portico.xcodeproj/xcshareddata/xcschemes/ || echo "No shared schemes"
          cat Portico.xcodeproj/xcshareddata/xcschemes/Portico.xcscheme | grep -o 'BlueprintName = "[^"]*"' | sort | uniq || true
          echo ""
          echo "=== Configurations ==="
          grep -o "name = Debug;" Portico.xcodeproj/project.pbxproj | head -n 5
          grep -o "name = Release;" Portico.xcodeproj/project.pbxproj | head -n 5
          echo ""
          echo "=== PRODUCT_BUNDLE_IDENTIFIER / PRODUCT_NAME / IPHONEOS_DEPLOYMENT_TARGET ==="
          grep "PRODUCT_BUNDLE_IDENTIFIER" Portico.xcodeproj/project.pbxproj | head -n 5
          grep "PRODUCT_NAME" Portico.xcodeproj/project.pbxproj | head -n 5
          grep "IPHONEOS_DEPLOYMENT_TARGET" Portico.xcodeproj/project.pbxproj | head -n 10
          echo ""
          echo "=== Portico.app product ==="
          grep "Portico.app" Portico.xcodeproj/project.pbxproj | head -n 10
          echo ""
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project Portico.xcodeproj || true

      - name: Build Portico App (iOS device)
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Debug \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            clean build

      - name: Locate Portico.app (iOS device)
        run: |
          echo "=== Locating Portico.app (iOS device) ==="
          echo "Searching DerivedData for Portico.app..."
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 20
          echo ""
          # Prefer Debug-iphoneos/Portico.app (device ARM64)
          APP_PATH="$PWD/build/DerivedData/Build/Products/Debug-iphoneos/Portico.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: current Portico.app not found: $APP_PATH"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          ls -lh "$APP_PATH"
          echo ""
          du -sh "$APP_PATH"
          echo ""
          echo "Frameworks inside app:"
          ls -lh "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"
          echo ""
          # Copy to staging for artifact
          mkdir -p build/app-artifact
          rm -rf build/app-artifact/Portico.app
          cp -R "$APP_PATH" build/app-artifact/
          echo "Staged:"
          ls -lh build/app-artifact/
          du -sh build/app-artifact/Portico.app

      - name: Upload WinOS App (Portico.app device)
        uses: actions/upload-artifact@v4
        with:
          name: winos-app
          path: build/app-artifact/Portico.app
          if-no-files-found: error

      - name: Package WinOS IPA (unsigned)
        run: |
          set -e
          echo "Packaging WinOS IPA..."
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/app-artifact/Portico.app build/ipa/Payload/Portico.app
          cd build/ipa
          zip -qry ../WinOS-unsigned.ipa Payload
          cd ../..
          echo "IPA CREATED SUCCESSFULLY:"
          ls -lh build/WinOS-unsigned.ipa
          echo "IPA CONTENTS:"
          unzip -l build/WinOS-unsigned.ipa

      - name: Upload WinOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: winos-ipa
          path: build/WinOS-unsigned.ipa
          if-no-files-found: error

      - name: Build Portico App (iOS Simulator)
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate Portico.app (Simulator)
        if: always()
        run: |
          echo "=== Locating Portico.app (Simulator) ==="
          SIM_APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug-iphonesimulator/Portico.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$SIM_APP" ]; then
            echo "Found simulator app at: $SIM_APP"
            ls -lh "$SIM_APP" | head -n 20
            du -sh "$SIM_APP"
            mkdir -p build/app-artifact-sim
            rm -rf build/app-artifact-sim/Portico.app
            cp -R "$SIM_APP" build/app-artifact-sim/
            ls -lh build/app-artifact-sim/
          else
            echo "Simulator Portico.app not found (optional)"
          fi

      - name: Upload WinOS App (Simulator)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winos-app-simulator
          path: build/app-artifact-sim/Portico.app
          if-no-files-found: ignore

      - name: Archive (optional, no signing - diagnostic only)
        if: always()
        continue-on-error: true
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/Portico.xcarchive || echo "Archive may require signing, but device build already succeeded - not failing workflow"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            *.log
          if-no-files-found: ignore
