name: WinOS iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build WinOS (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --version
          swift --version
          clang --version

      - name: Show SDKs
        run: |
          xcodebuild -showsdks

      - name: List targets and schemes
        run: |
          xcodebuild -list -project Portico.xcodeproj

      - name: Build PorticoRuntime
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -target PorticoRuntime \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build PorticoCore
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -target PorticoCore \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build Portico App - iOS device
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Portico App - iOS simulator
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive WinOS
        run: |
          xcodebuild \
            -project Portico.xcodeproj \
            -scheme Portico \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WinOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: WinOS-iOS-archive
          path: ${{ runner.temp }}/WinOS.xcarchive
